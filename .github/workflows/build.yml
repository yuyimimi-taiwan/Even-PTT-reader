name: Build Even PTT Reader

on:
  push:
    branches:
      - codespace-didactic-train-wvg5qxwwj9r6c5q67
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install -g @evenrealities/evenhub-cli
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: Even-PTT-reader
          path: even-ptt-reader.ehpk
          if-no-files-found: error
